<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Academy - Votre Centre d'Excellence en Anglais</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<style>
    /* Variables globales */
:root {
    --primary-color: #2c3e50;
    --secondary-color: #3498db;
    --accent-color: #e74c3c;
    --text-color: #333;
    --light-bg: #f5f6fa;
    --white: #ffffff;
    --gradient-primary: linear-gradient(135deg, #2c3e50, #3498db);
    --gradient-accent: linear-gradient(135deg, #e74c3c, #f39c12);
    --box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    --transition: all 0.3s ease;
}

/* Reset et styles de base */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.6;
    color: var(--text-color);
    overflow-x: hidden;
    padding-top: 80px;
    margin: 0;
}

/* Navigation */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 1rem 2rem;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(10px);
    box-shadow: var(--box-shadow);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
    transition: var(--transition);
}

.navbar.scroll-down,
.navbar.scroll-up {
    transform: none;
}

.logo h1 {
    color: var(--primary-color);
    font-size: 1.8rem;
    font-weight: 700;
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.nav-links {
    display: flex;
    list-style: none;
}

.nav-links li {
    margin: 0 1.5rem;
}

.nav-links a {
    text-decoration: none;
    color: var(--primary-color);
    font-weight: 500;
    transition: var(--transition);
    position: relative;
}

.nav-links a::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--gradient-primary);
    transition: var(--transition);
}

.nav-links a:hover::after {
    width: 100%;
}

/* Hero Section */
.hero {
    height: calc(100vh - 80px);
    margin-top: -80px;
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('../images/7515510.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--white);
    position: relative;
    overflow: hidden;
    padding: 2rem;
}

.hero::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--gradient-primary);
    opacity: 0.4;
    animation: gradientAnimation 10s ease infinite;
}

.hero::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100px;
    background: linear-gradient(to top, var(--light-bg), transparent);
    pointer-events: none;
}

.hero-content {
    max-width: 1200px;
    padding: 2rem;
    position: relative;
    z-index: 1;
    animation: fadeInUp 1s ease;
    width: 100%;
}

.hero-content h1 {
    font-size: 4.5rem;
    margin-bottom: 1rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    animation: slideInLeft 1s ease;
    line-height: 1.2;
    font-weight: 800;
    color: var(--white);
}

.hero-content p {
    font-size: 1.4rem;
    margin-bottom: 2rem;
    animation: slideInRight 1s ease;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
    color: var(--white);
}

.cta-button {
    display: inline-block;
    padding: 1.2rem 3rem;
    background: var(--gradient-accent);
    color: var(--white);
    text-decoration: none;
    border-radius: 50px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 2rem;
    transition: var(--transition);
    box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
    animation: fadeInUp 1s ease 0.5s backwards;
    position: relative;
    overflow: hidden;
    z-index: 2;
}

.cta-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        120deg,
        transparent,
        rgba(255, 255, 255, 0.3),
        transparent
    );
    transition: 0.5s;
}

.cta-button:hover::before {
    left: 100%;
}

.cta-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
}

@keyframes gradientAnimation {
    0% {
        opacity: 0.4;
    }
    50% {
        opacity: 0.6;
    }
    100% {
        opacity: 0.4;
    }
}

/* Hero Features */
.hero-features {
    display: flex;
    justify-content: center;
    gap: 3rem;
    margin: 2rem 0;
    flex-wrap: wrap;
}

.feature-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: rgba(255, 255, 255, 0.1);
    padding: 1rem 2rem;
    border-radius: 50px;
    backdrop-filter: blur(5px);
    transition: var(--transition);
    animation: fadeInUp 1s ease backwards;
}

.feature-item:nth-child(1) { animation-delay: 0.2s; }
.feature-item:nth-child(2) { animation-delay: 0.4s; }
.feature-item:nth-child(3) { animation-delay: 0.6s; }

.feature-item:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateY(-3px);
}

.feature-item i {
    font-size: 1.5rem;
    color: var(--secondary-color);
}

.feature-item span {
    font-size: 1.1rem;
    font-weight: 500;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
}

/* À propos Section */
.about {
    padding: 8rem 2rem;
    background: var(--light-bg);
    position: relative;
    background-image: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)), url('../images/7499800.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.about h2 {
    text-align: center;
    margin-bottom: 4rem;
    color: var(--primary-color);
    font-size: 2.5rem;
    position: relative;
    display: inline-block;
}

.about h2::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 3px;
    background: var(--gradient-primary);
}

.about-content {
    max-width: 1200px;
    margin: 0 auto;
}

.about-features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2.5rem;
    margin-top: 3rem;
}

.feature {
    text-align: center;
    padding: 2.5rem;
    background: var(--white);
    border-radius: 15px;
    box-shadow: var(--box-shadow);
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

.feature::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: var(--gradient-primary);
}

.feature:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}

.feature i {
    font-size: 3rem;
    color: var(--secondary-color);
    margin-bottom: 1.5rem;
    transition: var(--transition);
}

.feature:hover i {
    transform: scale(1.1);
}

/* Programmes Section */
.programs {
    padding: 8rem 2rem;
    background: var(--white);
    background-image: linear-gradient(rgba(255,255,255,0.95), rgba(255,255,255,0.95)), url('../images/18166.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

.programs h2 {
    text-align: center;
    margin-bottom: 4rem;
    color: var(--primary-color);
    font-size: 2.5rem;
}

.program-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 2.5rem;
    max-width: 1200px;
    margin: 0 auto;
}

.card {
    background: var(--white);
    padding: 2.5rem;
    border-radius: 15px;
    box-shadow: var(--box-shadow);
    transition: var(--transition);
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--gradient-primary);
    opacity: 0;
    transition: var(--transition);
    z-index: 1;
}

.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}

.card:hover::before {
    opacity: 0.05;
}

.card h3 {
    color: var(--primary-color);
    margin-bottom: 1.5rem;
    font-size: 1.8rem;
    position: relative;
    z-index: 2;
}

.card ul {
    list-style: none;
    margin-top: 1.5rem;
    position: relative;
    z-index: 2;
}

.card ul li {
    margin: 1rem 0;
    padding-left: 2rem;
    position: relative;
    font-size: 1.1rem;
}

.card ul li:before {
    content: "✓";
    color: var(--secondary-color);
    position: absolute;
    left: 0;
    font-weight: bold;
}

/* Galerie Section */
.gallery {
    padding: 8rem 2rem;
    background: var(--light-bg);
